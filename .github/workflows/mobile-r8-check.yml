name: Mobile R8 Check

# Runs the RELEASE variant on a real emulator, since R8 can break reflection-heavy
# code only at runtime and no unit test sees that. Builds x86_64 only:
#   as-shipped   what a release build is, R8 on. Cold-started to the login screen.
#   no-r8        the same commit with R8 off, for the size comparison.
#   check        R8 on, plus two things the shipped app must not have: the debug
#                source set's widget preview, and cleartext so it can reach the
#                stub server. It draws every widget and signs in against the stub.
#   check-no-r8  the same with R8 off, signed in and then updated to check, since an
#                in-place update is how every existing user gets R8.
# See mobile/scripts/r8-check.sh for what fails the run.
#
# HOW IT RUNS: push a tag like `mobile-r8-check-1`. It builds and publishes nothing
# else, and uses no versionCode.

on:
  push:
    tags: ['mobile-r8-check-*']

concurrency:
  group: mobile-r8-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Release variant on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      - name: The plugin switched R8 on
        working-directory: mobile/android
        run: |
          grep -x 'android.enableMinifyInReleaseBuilds=true' gradle.properties
          grep -n 'enableMinifyInReleaseBuilds' app/build.gradle

      - name: OTA updates are off
        working-directory: mobile/android
        run: grep 'expo.modules.updates.ENABLED" android:value="false"' app/src/main/AndroidManifest.xml

      - name: Disable release-lint gate (match the release workflow)
        working-directory: mobile/android
        run: |
          node -e "const fs=require('fs');const p='app/build.gradle';let s=fs.readFileSync(p,'utf8');if(!/checkReleaseBuilds\s+false/.test(s)){s=s.replace(/android\s*\{/, m=>m+'\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }');fs.writeFileSync(p,s);console.log('Injected lint{} disable into app/build.gradle');}else{console.log('lint disable already present');}"

      - name: Build as shipped (R8 on)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          mkdir -p ../r8-check
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../r8-check/as-shipped.apk
          cp app/build/outputs/bundle/release/app-release.aab ../r8-check/as-shipped.aab
          cp app/build/outputs/mapping/release/mapping.txt ../r8-check/mapping.txt
          cp app/build/outputs/mapping/release/configuration.txt ../r8-check/r8-configuration.txt || true
          cp app/build/outputs/mapping/release/missing_rules.txt ../r8-check/missing_rules.txt || true

      - name: Build the same commit with R8 off (size comparison)
        working-directory: mobile/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64 -Pandroid.enableMinifyInReleaseBuilds=false
          cp app/build/outputs/apk/release/app-release.apk ../r8-check/no-r8.apk

      - name: Build the check APKs (preview and cleartext added, R8 off then on)
        run: |
          widgets=modules/finlynq-widgets/android/src
          cp -r "$widgets/debug" "$widgets/release"
          sed -i 's|<application>|<application android:usesCleartextTraffic="true">|' "$widgets/release/AndroidManifest.xml"
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64 -Pandroid.enableMinifyInReleaseBuilds=false
          cp app/build/outputs/apk/release/app-release.apk ../r8-check/check-no-r8.apk
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../r8-check/check.apk

      - name: The bundle carries the mapping, and what R8 did
        run: |
          set -o pipefail
          bash scripts/r8-report.sh r8-check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: bash scripts/r8-check.sh

      - name: Upload what it saw
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-check
          path: |
            mobile/r8-check
            !mobile/r8-check/*.aab
            !mobile/r8-check/no-r8.apk
            !mobile/r8-check/check.apk
            !mobile/r8-check/check-no-r8.apk
          if-no-files-found: warn
          retention-days: 14
