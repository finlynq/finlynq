name: Mobile Widget Check

# Builds a debug app and draws the Android home-screen widgets on a real emulator,
# through a real AppWidgetHost, in every scenario, light and dark. The images are
# in the run's artifact, since widgets can't be seen from a unit test.
#
# HOW IT RUNS: push a tag like `mobile-widget-check-1`. It builds and publishes
# nothing else, and uses no versionCode.

on:
  push:
    tags: ['mobile-widget-check-*']

concurrency:
  group: mobile-widget-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render widgets on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      - name: Bundle JS into the debug build
        working-directory: mobile/android
        run: |
          # The emulator has no Metro; with no debuggable variants the debug build
          # embeds the JS bundle, so the real app can start.
          node -e "const fs=require('fs');const p='app/build.gradle';let s=fs.readFileSync(p,'utf8');s=s.replace(/react\s*\{/, m=>m+'\n    debuggableVariants = []');fs.writeFileSync(p,s);console.log(s.split('\n').filter(l=>l.includes('debuggableVariants')).join('\n'));"

      - name: Gradle assembleDebug (x86_64)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Draw the widgets on an emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: bash scripts/widget-render-check.sh

      - name: Upload what was drawn
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-render
          path: mobile/widget-render
          if-no-files-found: warn
          retention-days: 14
